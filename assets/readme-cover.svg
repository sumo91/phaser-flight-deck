<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Phaser Flight Deck</title>
  <desc id="desc">Phaser 4 项目验证工具链，证据优先</desc>
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232833"/>
      <stop offset="1" stop-color="#181C23"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F0EC"/>
      <stop offset="1" stop-color="#C9CDD4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#deck)"/>

  <!-- 斜角跑道标线 + 甲板边灯 -->
  <path d="M -40 330 L 1240 118" stroke="#C9A227" stroke-width="3" stroke-dasharray="26 20" opacity="0.22" fill="none"/>
  <circle cx="120" cy="322" r="3" fill="#E4593F" opacity="0.5"/>
  <circle cx="360" cy="284" r="3" fill="#E4593F" opacity="0.42"/>
  <circle cx="600" cy="246" r="3" fill="#E4593F" opacity="0.34"/>
  <circle cx="840" cy="208" r="3" fill="#E4593F" opacity="0.26"/>
  <circle cx="1080" cy="170" r="3" fill="#E4593F" opacity="0.2"/>
  <circle cx="92" cy="388" r="150" fill="#7FA0B8" opacity="0.05"/>

  <path d="M80 88 H432" stroke="#E4593F" stroke-width="3"/>

  <text x="80" y="72" fill="#E4593F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="3">PHASER FLIGHT DECK · V0.6.0</text>
  <text x="80" y="180" fill="url(#chalk)" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="700" letter-spacing="1">Phaser Flight Deck</text>
  <text x="84" y="232" fill="#9AA3AE" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="26">先拿到事实，再谈判断</text>

  <!-- 起飞前检查单 -->
  <g font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="15" fill="#C9CDD4">
    <g stroke="#5B9A6B" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 296 l4 5 l8 -10"/>
      <path d="M170 296 l4 5 l8 -10"/>
      <path d="M251 296 l4 5 l8 -10"/>
      <path d="M341 296 l4 5 l8 -10"/>
      <path d="M449 296 l4 5 l8 -10"/>
      <path d="M557 296 l4 5 l8 -10"/>
    </g>
    <text x="100" y="304">doctor</text>
    <text x="190" y="304">check</text>
    <text x="271" y="304">verify</text>
    <text x="361" y="304">playtest</text>
    <text x="469" y="304">simulate</text>
    <text x="577" y="304">visual</text>
  </g>
  <path d="M80 340 H740" stroke="#3A414C" stroke-width="1"/>

  <!-- 终端信封卡片：这工具最真实的输出 -->
  <g>
    <rect x="760" y="96" width="368" height="252" rx="14" fill="#14171D" stroke="#333A46" stroke-width="1.5"/>
    <circle cx="786" cy="122" r="5" fill="#E4593F"/>
    <circle cx="806" cy="122" r="5" fill="#E4B33F"/>
    <circle cx="826" cy="122" r="5" fill="#5B9A6B"/>
    <path d="M760 142 H1128" stroke="#232833" stroke-width="1.5"/>

    <g font-family="'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="14">
      <text x="784" y="172"><tspan fill="#E4593F">$</tspan> <tspan fill="#8FA3B8">pdeck verify phaser-app</tspan></text>
      <text x="784" y="200" fill="#7BC47F">verdict: PASSED</text>
      <text x="784" y="224" fill="#B9BFC8">summary: 真实浏览器渲染与</text>
      <text x="784" y="244" fill="#B9BFC8">输入可达，0 errors</text>
      <text x="784" y="272" fill="#6E7682">[canvas] 1280x800</text>
      <text x="784" y="292" fill="#6E7682">[capture] .pdeck/captures/*.png</text>
      <text x="784" y="324" fill="#E4593F">▌</text>
    </g>
  </g>

  <text x="1118" y="380" text-anchor="end" fill="#6E7682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" letter-spacing="2">EVIDENCE OVER PROMISES</text>
</svg>
