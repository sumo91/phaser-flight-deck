    <rect x="12" y="12" width="130" height="130" rx="22" fill="none" stroke="#E4593F" stroke-width="2" opacity="0.55"/>
    <text x="77" y="103" text-anchor="middle" fill="#E4593F" font-family="'STKaiti', 'KaiTi', serif" font-size="76" font-weight="700">验</text>
  </g>

  <text x="1118" y="367" text-anchor="end" fill="#6E7682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" letter-spacing="1">EVIDENCE-FIRST TOOLCHAIN FOR PHASER 4</text>
