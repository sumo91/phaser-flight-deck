<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Phaser Flight Deck</title>
  <desc id="desc">Phaser 4 项目验证工具链</desc>
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262B33"/>
      <stop offset="1" stop-color="#1A1E25"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F0EC"/>
      <stop offset="1" stop-color="#C9CDD4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#deck)"/>
  <circle cx="1115" cy="52" r="180" fill="#E4593F" opacity="0.06"/>
  <circle cx="1140" cy="30" r="108" fill="none" stroke="#E4593F" stroke-width="2" opacity="0.22"/>
  <circle cx="92" cy="388" r="150" fill="#7FA0B8" opacity="0.06"/>
  <path d="M80 88 H432" stroke="#E4593F" stroke-width="3"/>
  <path d="M80 328 H810" stroke="#3A414C" stroke-width="1"/>

  <text x="80" y="72" fill="#E4593F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="3">PHASER FLIGHT DECK · V0.6.0</text>
  <text x="80" y="192" fill="url(#chalk)" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="700" letter-spacing="2">Phaser Flight Deck</text>
  <text x="84" y="250" fill="#9AA3AE" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="27">先拿到事实，再谈判断</text>

  <g font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#E8E6E2">
